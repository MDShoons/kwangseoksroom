[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authorized-vocal-style-ai"
version = "0.1.0"
description = "Consent-based vocal style AI prototype scaffold"
readme = "README_ko.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "soundfile>=0.12",
  "PyYAML>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]
